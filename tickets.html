<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your Festival Tickets</title>
  <style>
    :root {
      --ivory: #f2eadf;
      --pink: #ff348f;
      --violet: #7b2cff;
      --dark: #08070b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ivory);
      background: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 clamp(16px, 4vw, 50px);
      border-bottom: 1px solid rgba(255,255,255,.13);
      background: #100d15;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .topbar strong { color: #5ce7ff; }

    .download {
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.45);
      color: var(--ivory);
      text-decoration: none;
      transition: .2s ease;
    }

    .download:hover {
      color: #09070c;
      background: var(--ivory);
    }

    .viewer {
      width: 100%;
      height: calc(100% - 58px);
      border: 0;
      background: #29252e;
    }

    .reveal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      visibility: hidden;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 25%, rgba(123,44,255,.35), transparent 44%),
        rgba(2,2,4,.91);
      backdrop-filter: blur(13px);
      transition: opacity .55s ease, visibility .55s ease;
    }

    .reveal.visible {
      visibility: visible;
      opacity: 1;
    }

    .card {
      width: min(680px, 94vw);
      padding: clamp(36px, 7vw, 72px) clamp(24px, 6vw, 60px);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 22px;
      background: linear-gradient(145deg, #181020, #0d0a11);
      text-align: center;
      box-shadow: 0 30px 100px rgba(0,0,0,.7);
      transform: scale(.88) translateY(25px);
      transition: transform .6s cubic-bezier(.2,.9,.25,1.15);
    }

    .reveal.visible .card { transform: scale(1) translateY(0); }

    .card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      top: -190px;
      left: 50%;
      border-radius: 50%;
      background: var(--pink);
      filter: blur(70px);
      opacity: .45;
      transform: translateX(-50%);
    }

    .emoji {
      position: relative;
      margin-bottom: 18px;
      font-size: clamp(56px, 10vw, 90px);
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(38px, 8vw, 78px);
      line-height: .95;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .punchline {
      position: relative;
      margin: 25px auto 8px;
      color: #ff73b4;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      line-height: 1.25;
    }

    .signature {
      margin: 18px 0 0;
      color: rgba(255,255,255,.68);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .actions {
      position: relative;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    button, .real-download {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--ivory);
      border-radius: 50px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button {
      color: #111;
      background: var(--ivory);
    }

    .real-download {
      display: inline-flex;
      align-items: center;
      color: var(--ivory);
      background: transparent;
      text-decoration: none;
    }

    .legal {
      position: relative;
      margin: 28px 0 0;
      color: rgba(255,255,255,.45);
      font-size: 9px;
      letter-spacing: .09em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .topbar span { display: none; }
      .topbar { justify-content: center; }
      .viewer { height: calc(100% - 58px); }
      .card { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>Bucharest Deep House Festival</strong>
    <span>Two complimentary tickets</span>
    <a class="download" href="tickets-radu.pdf" download>Download PDF</a>
  </header>

  <iframe
    class="viewer"
    src="tickets-radu.pdf#view=FitH"
    title="Your two festival tickets">
  </iframe>

  <section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
    <div class="card">
      <div class="emoji">😂</div>
      <h1 id="reveal-title">Surprise!</h1>
      <p class="punchline">You just got pranked by your wife! Ahah!</p>
      <p class="signature">With love — your wife</p>

      <div class="actions">
        <button type="button" id="close-reveal">Look at my fake tickets again</button>
        <a class="real-download" href="tickets-radu.pdf" download>Keep the souvenir</a>
      </div>

      <p class="legal">Unofficial parody · Fictional event · Tickets are not valid for entry</p>
    </div>
  </section>

  <script>
    const reveal = document.getElementById("reveal");
    const closeReveal = document.getElementById("close-reveal");

    window.setTimeout(() => {
      reveal.classList.add("visible");
    }, 20000);

    closeReveal.addEventListener("click", () => {
      reveal.classList.remove("visible");
    });
  </script>
</body>
</html>
